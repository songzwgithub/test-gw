[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrogeo-insar"
version = "0.3.0"
description = "Reproducible hydrogeodetic analysis from corrected cumulative InSAR GeoTIFF time series and groundwater observations"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "PyYAML>=6.0",
  "h5py>=3.10",
  "scikit-learn>=1.3",
  "openpyxl>=3.1",
  "matplotlib>=3.8"
]

[project.scripts]
hydrogeo-insar = "hydrogeo_insar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
