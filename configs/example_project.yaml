project:
  name: hengshui_v3
  root: ..

outputs: outputs

analysis:
  start_date: 2018-01-01
  end_date: 2025-12-31

# Input readers intentionally follow the verified test-gw format.
insar:
  path: data/raw/insar
  pattern: "geo_*.tif"
  filename_regex: "geo_(\\d{8})_(\\d{8})\\.tif$"
  unit: mm
  quantity: vertical_displacement
  positive: uplift
  block_size: 256

groundwater:
  path: data/raw/groundwater.xlsx
  format: wide
  sheet_name: 0
  variable: depth_to_water
  fields:
    station_id: well_id
    lon: lon
    lat: lat
    aquifer_class: layer
    well_depth_m: depth_m
    elevation_m: 地面标高
  aquifer_labels:
    承压水: confined
    潜水: unconfined
  minimum_water_depth_m: -0.5

groundwater_field:
  aquifer: confined
  max_gap_days: 7
  min_coverage_fraction: 0.50
  min_active_well_fraction: 0.50
  max_temporal_interpolation_gap_days: 60
  min_baseline_observations: 6
  coordinate_tolerance_deg: 0.00001
  svd_iterations: 20
  projected_crs: null
  grid_block_size: 256
  baseline:
    start: 2018-01-01
    end: 2018-12-31
  rank_candidates: [3, 4, 5, 6]
  rbf:
    max_centers: 32
    sigma_km_candidates: [15, 25, 35, 50]
    ridge_candidates: [0.0001, 0.001, 0.01]
  cross_validation:
    folds: 5
    block_km: 30
    random_state: 20260919
    annual_period_days: 365.2425
    harmonic_polynomial_degree: 1
    rmse_shortlist_fraction: 0.05
  support:
    max_nearest_well_km: null

deformation:
  polynomial_degree: 2
  annual_period_days: 365.2425
  min_observations: 24
  vertex_min_abs_curvature: 0.0001
  block_size: 256

regimes:
  feature_scheme: meng2026
  k_candidates: [2, 3, 4, 5, 6]
  k: null
  training_spacing_km: 2.0
  selection_sample_size: 50000
  predict_chunk_size: 200000
  random_state: 20260919
  stable_rate_mm_yr: 5.0
  deceleration_threshold_mm_yr: 5.0

seasonal_response:
  annual_period_days: 365.2425
  min_observations: 24
  block_size: 256
  deformation_polynomial_degree: 2
  groundwater_polynomial_degree: auto
  groundwater_polynomial_candidates: [1, 2]
  groundwater_model_selection: f_test
  groundwater_f_test_alpha: 0.05
  model_selection_sample_size: 3000
  min_head_amplitude_m: 0.2
  min_deformation_amplitude_mm: 0.5
  lag_search_days: [0, 180]
  lag_step_days: 0.5
  lag_sample_size: 200000
  random_state: 20260919

ske:
  min: 0.0
  max: 0.05
  observation_cell_km: 2.5
  node_spacing_km_candidates: [10, 15, 20, 25]
  basis_sigma_factor: 1.5
  max_basis_neighbors: 12
  max_extrapolation_km: 30
  min_vector_cosine: 0.0
  lambda_candidates: [0.1, 1.0, 10.0, 100.0]
  cv_block_km: 30
  aggregation_block_size: 256
  rasterize_block_size: 256

storage:
  partition_model: jiang2018
  annual_period_days: 365.2425
  baseline_date: 2018-01-01
  end_date: null
  valid_fraction: 0.90
  min_observations: 24
  block_size: 128

hydrostratigraphy:
  enabled: false
  layers:
    - id: AQ1
      sand: data/raw/geology/AQ1_sand_thickness.tif
      clay: data/raw/geology/AQ1_clay_thickness.tif
    - id: AQ2
      sand: data/raw/geology/AQ2_sand_thickness.tif
      clay: data/raw/geology/AQ2_clay_thickness.tif

extensometer:
  enabled: false
  path: data/raw/extensometer.csv
  measurement_type: interval_compaction
  lon: null
  lat: null
  fields:
    date: date
    depth_top_m: depth_top_m
    depth_bottom_m: depth_bottom_m
    compaction_mm: compaction_mm

visualization:
  dpi: 180
  max_display_pixels: 1400
  output_directory: outputs/figures/checks
